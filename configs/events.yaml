# Event engine parameters. Every class stays enabled: false until it shows near-zero false
# fires on all sample footage (and recall where the samples contain it). Scores on C3905 are
# in-sample and provisional until the teammates' two-pass labels lock G1.
defaults:
  merge_gap_s: 0.0
  min_dur_s: 0.0

red_light:
  enabled: false
  stop_line: near_stop
  approach: near
  vehicle_classes: [2, 3, 4, 5]
  min_alignment: 0.5          # cos of angle between velocity and approach direction
  min_past_px: 25             # front point must get this far past the line (jitter guard)
  max_lateral_margin: 0.05    # fraction of stop-line length beyond its ends still counted
  merge_gap_s: 0.0

stop_line:
  enabled: false
  stop_line: near_stop
  approach: near
  vehicle_classes: [2, 3, 4, 5]
  min_past_px: 25
  min_past_box_h: 0.5         # front proxy must be half a box height past the line (corner overshoot)
  max_lateral_margin: 0.05
  min_stop_s: 1.0             # stationary this long past the line during red
  still_rel_speed: 0.15       # body heights per second
  max_gap_s: 0.2              # a stop is sustained: crawling samples near the threshold do not bridge
  merge_gap_s: 1.0

jaywalking:
  enabled: false
  min_on_road_s: 1.0          # persistence before a pedestrian counts as on the carriageway
  max_gap_s: 0.5              # hysteresis: brief off-road blips do not end the event
  walk_through_gap_s: 2.5     # a refuge/crossing contact (sample gap incl. margins) up to this long ...
  walk_through_max_still_s: 1.0    # ... if the pedestrian never stands still that long during it
  crosswalk_margin_px: 20     # foot points this close to a crossing or refuge count as on it
  margin_box_h: 0.5           # ... or within half the person's box height (~1 m), whichever is larger
  boundary_box_h: 0.15        # start/end are set where the foot is ~25 cm off a crossing, refuge or curb
  rider_overlap: 0.5          # person boxes overlapping a bicycle/motorcycle this much are riders
  max_walk_speed_rel: 2.5     # body heights/s; faster runs are riders or misdetections
  frame_edge_px: 4            # boxes touching the frame border have no foot point
  merge_gap_s: 1.0
  min_dur_s: 1.0

wrong_way:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  min_resultant: 0.8          # atlas cell must have a consistent direction (mean resultant length)
  min_speed_rel: 0.5          # body heights/s; slower motion gives no heading verdict
  against_deg: 135            # confirmed wrong way: within 45 degrees of the reverse flow
  entry_deg: 90               # start backdated over samples already this far against the flow
  return_deg: 60              # back within this of the flow = returned to a correct lane
  max_unjudged_backdate_s: 1.0
  min_persist_s: 1.5
  max_gap_s: 1.0              # brief unjudged/noisy samples inside a run do not split it
  min_travel_box_h: 2.0       # must travel at least two of its own box heights against the flow
  frame_edge_px: 8            # boxes touching the frame border give no heading verdict
  merge_gap_s: 1.0

stopped_vehicle:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  still_rel_speed: 0.15       # body heights/s
  min_stop_s: 10.0            # spec: stationary for 10 s or more (of unexplained standing)
  dwell_radius_h: 0.5         # stopped while the median foot point stays within half a box height
  dwell_median_s: 1.0         # median filter against box jitter (occlusion by passing vehicles)
  min_other_stop_s: 3.0       # another vehicle's stop this long marks a normal stopping place
  place_radius_h: 1.0         # ... if it stood within one box height of this stop
  place_min_others: 2         # ... and at least this many other vehicles did
  queue_gap_h: 2.5            # a stationary vehicle this close ahead (box heights) = queue chain
  queue_lateral_h: 0.6
  crawl_rel_speed: 0.6        # neighbours slower than this count towards a standstill
  jam_radius_h: 3.0
  jam_min_neighbours: 3
  stop_line: near_stop        # signal queue head on the controlled approach during red
  approach: near
  signal_reach_h: 3.0         # queue head within this of the line
  min_past_box_h: 0.5
  frame_edge_px: 8
  merge_gap_s: 1.0

failure_to_yield:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  footprint_depth: 0.5        # lower half of the box is the vehicle's ground footprint
  min_vehicle_speed_rel: 0.3  # body heights/s; slower = waiting or yielding
  min_through_speed_rel: 0.5  # median over the crossing: it drives through, not queues on it
  min_travel_box_h: 0.5       # and moves at least half its box height while on it
  conflict_box_h: 1.0         # pedestrian within this many vehicle box heights of its bottom edge ...
  behind_tolerance_box_h: 0.25  # ... and not behind it along its travel direction
  kerb_margin_box_h: 0.5      # pedestrians within ~1 m of a kerb, refuge or median are waiting, not on it
  min_conflict_s: 0.3         # sustained over at least two stride-3 samples
  step_margin_box_h: 0.5      # a pedestrian this close to the crossing (own box heights) ...
  step_lookahead_s: 0.5       # ... whose motion carries them onto it within this time is stepping on
  min_ped_speed_rel: 0.3
  rider_overlap: 0.5
  frame_edge_px: 4
  max_gap_s: 0.5
  merge_gap_s: 1.0

solid_line_crossing:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  deadband_box_h: 0.15        # foot point this close to the line gives no side
  min_side_s: 0.6             # settled on each side at least this long (not jitter or a brief drift)
  max_transit_s: 3.0          # from the last sample on the old side to the first on the new one
  min_speed_rel: 0.3          # body heights/s while crossing
  max_jump_box_h: 0.8         # a foot jump this large between samples is an ID switch, not a manoeuvre
  max_backdate_s: 1.5         # the first wheel crossing is searched this far before the foot crossing
  max_settle_s: 2.0           # "fully in the new lane" is searched this far after it
  frame_edge_px: 8
  merge_gap_s: 0.0

congestion:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  min_resultant: 0.8          # corridor cells need a consistent normal direction ...
  corridor_deg: 40            # ... within this of the approach direction
  min_corridor_cells: 6
  stop_line_margin: 0.3       # cells behind a stop line (within this fraction beyond its ends) are its queue
  min_vehicles: 5             # vehicles standing in the corridor at one sample
  crawl_rel_speed: 0.3        # body heights/s: standing or crawling
  min_slow_fraction: 0.85
  free_rel_speed: 1.0         # any vehicle this fast in the corridor = a lane still flows
  min_lateral_cover: 0.4      # slow vehicles span this fraction of the corridor's width (all lanes)
  min_on_s: 10.0
  max_gap_s: 3.0              # one noisy sample or a single car creeping through does not end it
  min_green_s: 10.0           # signalled approach: still standing through this much green
  min_unsignalled_s: 60.0     # approach without a known signal: longer than a signal cycle
  frame_edge_px: 8
  merge_gap_s: 5.0

illegal_turn: &turns
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  min_speed_rel: 0.5          # body heights/s; slower samples carry no reliable heading
  heading_smooth_s: 0.5       # moving median over the unwrapped heading
  rate_window_s: 1.0          # heading rate measured across this window
  min_rate_deg_s: 12          # turning while the heading changes at least this fast ...
  max_rate_deg_s: 120         # ... but no faster: quicker flips are velocity noise, not steering
  max_gap_s: 0.6              # ... bridging short slower stretches
  min_turn_deg: 45            # total change for a turn
  min_turn_s: 1.0
  min_travel_box_h: 1.5       # path length along the turn, in the vehicle's box heights
  u_turn_deg: 150             # at or above this it is a U-turn (illegal_u_turn)
  lane_lookback_s: 5.0        # lane-arrow zone the vehicle was in up to this long before turning
  frame_edge_px: 8
  merge_gap_s: 0.0

illegal_u_turn:
  <<: *turns                  # same turn finder and thresholds as illegal_turn
  enabled: false
  merge_gap_s: 0.0

near_miss:
  enabled: false
  vel_window_s: 0.6           # centred velocity/acceleration fits (Part A may look ahead)
  min_heading_speed_h: 0.5    # slower objects carry no yaw rate
  frame_edge_px: 8
  rider_overlap: 0.5
  ped_margin_box_h: 0.5       # pedestrians within ~1 m of a kerb, refuge or median are off the road
  max_pair_dist_h: 8.0
  footprint_depth: 0.35       # lower band of the box = ground footprint for the contact proxy
  contact_overlap: 0.1
  tca_max_s: 2.0              # conflict: closest approach within this time ...
  dmin_max_h: 0.5             # ... predicted to come this close (pair box heights) ...
  closing_min_h: 0.8          # ... closing at least this fast (box heights/s)
  follow_cos: 0.87            # |cos| above this = parallel paths (within 30 degrees) ...
  rear_closing_min_h: 2.0     # ... which count only when closing this fast
  conflict_gap_s: 0.5
  pre_s: 1.0                  # evasive action searched from this long before the conflict ...
  post_s: 1.5                 # ... to this long after it
  moving_h: 0.5               # crossing conflicts need both road users moving this fast
  brake_h_s2: 3.5             # hard braking (box heights/s^2); a normal stop is ~1
  onset_h_s2: 1.0             # the brake's onset is backdated while deceleration exceeds this
  min_speed_before_h: 1.0     # braking from at least this speed
  swerve_deg_s: 40            # yaw rate of a swerve ...
  swerve_max_deg_s: 150       # ... up to this; faster is heading noise on a small or occluded box
  swerve_return_s: 1.5        # ... after which, within this long, the heading is back on course:
  swerve_max_net_deg: 25      # net heading change around the swerve at most this
  min_evasive_s: 0.3
  evasive_gap_s: 0.2
  max_box_change: 0.25        # box height change per sample above this = occlusion, not motion
  near_dist_h: 1.0            # the two must come within this of each other (pair box heights)
  clear_dist_h: 1.5           # clear of each other: this far apart and no longer closing
  max_event_s: 6.0
  merge_gap_s: 0.5

accident:
  enabled: false
  vehicle_classes: [2, 3, 4, 5]
  vel_window_s: 0.6
  min_heading_speed_h: 0.5
  frame_edge_px: 8
  rider_overlap: 0.5
  ped_margin_box_h: 0.5
  max_pair_dist_h: 8.0
  footprint_depth: 0.35       # lower band of the box = ground footprint
  contact_overlap: 0.1        # footprint overlap (fraction of the smaller) that counts as contact
  approach_s: 1.0             # closing speed / speed before contact looked up over this long
  impact_closing_h: 1.0       # candidate without the risk model: touching while closing this fast
  risk_lookback_s: 5.0        # candidate from the risk model: it watched this pair within this ...
  risk_candidate: 0.3         # ... at this risk or higher
  impact_before_s: 0.3        # impact searched around the first contact
  impact_after_s: 1.0
  impact_decel_h_s2: 4.0      # abrupt deceleration (box heights/s^2); a hard brake is ~3.5 ...
  impact_yaw_deg_s: 60        # ... or yaw jump, up to
  impact_yaw_max_deg_s: 150   # physical yaw; faster is heading noise
  max_box_change: 0.25
  still_h: 0.2                # standing still (box heights/s)
  min_post_stop_s: 2.0        # post-impact stop lasts this long ...
  min_end_stop_s: 1.0         # ... or this long when the video or track ends
  post_window_s: 3.0          # and begins within this long of the contact
  stay_close_h: 1.5           # vehicles stop next to each other
  max_event_s: 30.0
  fixed_contact_fraction: 0.3 # fixed object: this share of the footprint on a kerb, refuge or median
  fixed_speed_h: 1.5          # arriving at least this fast
  fixed_impact_factor: 1.5    # with a clearly abrupt stop (x impact thresholds)
  merge_gap_s: 1.0

road_obstacle:
  enabled: false
  min_samples: 20             # visual samples (1 per second) needed at all
  sample_every_s: 1.0         # spacing of the visual samples (VisualCollector default)
  illum_sigma_px: 25          # frames are divided by this blur (640-px samples) against lighting drift
  diff_thr: 0.25              # normalised intensity change against the video's median background
  box_grow: 0.15              # track boxes grown by this fraction when explaining pixels
  max_covered_fraction: 0.3   # pixels covered by a track box this often in a window are explained
  window_s: 10.0
  window_step_s: 5.0
  min_area_px: 12             # at 640 px wide
  min_size_h: 0.3             # blob height relative to a vehicle box at the same depth ...
  max_size_h: 1.2             # ... larger is a vehicle or a lighting change
  min_edge_gain: 1.3          # textured: edge energy this much above the background's
  link_iou: 0.3
  link_gap: 1                 # windows without a match inside one obstacle
  min_persist_s: 20.0
  max_drift_box: 0.5          # stationary: centre moves at most this many of its own heights
  min_region_differs: 0.5     # a sample shows the obstacle when half its region differs
  still_rel_speed: 0.3        # road users standing (body heights/s) ...
  queue_grow: 0.5             # ... whose boxes, grown by half their size, touch the obstacle ...
  max_queue_fraction: 0.5     # ... in this share of its samples: a queue, not an obstacle
  merge_gap_s: 5.0

fire_smoke:
  enabled: false
  min_samples: 5
  road_grow_px: 10            # on or beside the carriageway (640-px samples)
  box_grow: 0.15
  moving_rel: 0.5             # lights inside the boxes of road users moving this fast are theirs
  min_area_px: 6
  fire_hue: [5, 30]           # OpenCV hue (0-180): orange to yellow
  fire_min_sat: 120
  fire_min_val: 190
  fire_min_size_h: 0.2        # flame blob side >= this of a vehicle box height at its depth
  fire_min_s: 5.0
  fire_min_flicker: 0.15      # coefficient of variation of the blob's area over time
  fire_on_vehicle_min_h: 0.35 # on a vehicle, the flames' height must be this share of its box height
  smoke_diff: 25              # grey levels brighter than the background after the global gain
  smoke_max_sat: 50
  smoke_edge_ratio: 0.8       # haze softens: edge energy at most this of the background's
  smoke_min_size_h: 0.6
  smoke_min_s: 8.0
  smoke_min_growth: 1.3       # area max/min over the chain ...
  smoke_min_drift: 0.5        # ... or centre drift in blob sizes
  link_iou: 0.2
  link_gap: 2
  merge_gap_s: 5.0
