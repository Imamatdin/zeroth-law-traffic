# Event engine parameters. Every class stays enabled: false until it shows near-zero false
# fires on all sample footage (and recall where the samples contain it). Scores on C3905 are
# in-sample and provisional until the teammates' two-pass labels lock G1.
defaults:
  merge_gap_s: 0.0
  min_dur_s: 0.0

red_light:
  enabled: false
  stop_line: near_stop
  approach: near
  vehicle_classes: [2, 3, 4, 5]
  min_alignment: 0.5          # cos of angle between velocity and approach direction
  min_past_px: 25             # front point must get this far past the line (jitter guard)
  max_lateral_margin: 0.05    # fraction of stop-line length beyond its ends still counted
  merge_gap_s: 0.0

stop_line:
  enabled: false
  stop_line: near_stop
  approach: near
  vehicle_classes: [2, 3, 4, 5]
  min_past_px: 25
  min_past_box_h: 0.5         # front proxy must be half a box height past the line (corner overshoot)
  max_lateral_margin: 0.05
  min_stop_s: 1.0             # stationary this long past the line during red
  still_rel_speed: 0.15       # body heights per second
  max_gap_s: 0.2              # a stop is sustained: crawling samples near the threshold do not bridge
  merge_gap_s: 1.0

jaywalking:
  enabled: false
  min_on_road_s: 1.0          # persistence before a pedestrian counts as on the carriageway
  max_gap_s: 0.5              # hysteresis: brief off-road blips do not end the event
  walk_through_gap_s: 2.5     # a refuge/crossing contact (sample gap incl. margins) up to this long ...
  walk_through_max_still_s: 1.0    # ... if the pedestrian never stands still that long during it
  crosswalk_margin_px: 20     # foot points this close to a crossing or refuge count as on it
  margin_box_h: 0.5           # ... or within half the person's box height (~1 m), whichever is larger
  boundary_box_h: 0.15        # start/end are set where the foot is ~25 cm off a crossing, refuge or curb
  rider_overlap: 0.5          # person boxes overlapping a bicycle/motorcycle this much are riders
  max_walk_speed_rel: 2.5     # body heights/s; faster runs are riders or misdetections
  frame_edge_px: 4            # boxes touching the frame border have no foot point
  merge_gap_s: 1.0
  min_dur_s: 1.0
